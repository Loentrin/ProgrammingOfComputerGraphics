<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

<div id="main">
	<div id="progtitle">Перевод цветовых моделей</div>
	<div id="editor">
		<div class="colHeaders">
		<div class="colHeaderDiv">
			<p class="colHeader">CMYK</p>
		</div>
		<div class="colHeaderDiv">
			<p class="colHeader">LAB</p>
		</div>
		<div class="colHeaderDiv">
			<p class="colHeader">HSV</p>
		</div>
		</div>
		<div class="clBlocks">
		<div class="clBlock" id="cmyk">
			<div class="slidersAndBoxes">
				<div class="colNamesArea">
					<div> <p class="colname" id="name0">C</p></div>
					<div> <p class="colname" id="name1">M</p></div>
					<div> <p class="colname" id="name2">Y</p></div>
					<div> <p class="colname" id="name3">K</p></div>
				</div>
				<div class="numberboxArea">
					<div> <input type="number" tabindex="-1" class="numberbox" id="box0" onchange="boxEvent(0)"> </div>
					<div> <input type="number" tabindex="-1" class="numberbox" id="box1" onchange="boxEvent(1)"> </div>
					<div> <input type="number" tabindex="-1" class="numberbox" id="box2" onchange="boxEvent(2)"> </div>
					<div>  <input type="number" tabindex="-1" class="numberbox" id="box3" onchange="boxEvent(3)"> </div>
				</div>
				<div class="sliderArea">
					<div> <input type="range" tabindex="-1" min="0" max="100" value="50" class="slider" id="slider0" oninput="sliderEvent(0)"> </div>
					<div> <input type="range" tabindex="-1" min="0" max="100" value="50" class="slider" id="slider1" oninput="sliderEvent(1)"> </div>
					<div> <input type="range" tabindex="-1" min="0" max="100" value="50" class="slider" id="slider2" oninput="sliderEvent(2)"> </div>
					<div> <input type="range" tabindex="-1" min="0" max="100" value="50" class="slider" id="slider3" oninput="sliderEvent(3)"> </div>
				</div>
			</div>
			<!--<div class="extraSettings" id="extra1">
				<fieldset>
					<legend>Алгоритм цветоделения</legend>
					<div>
    						<input type="radio" id="ucr" name="setting1" oninput="setCmykSetting('ucr')" />
    						<label for="setting1">UCR</label>
  					</div>
  					<div>
    						<input type="radio" id="gcr" name="setting1" oninput="setCmykSetting('gcr')"/>
    						<label for="setting2">GCR</label>
  					</div>
				</fieldset>
			</div>-->
		</div>
		
		<div class="clBlock" id="lab">
			<div class="slidersAndBoxes">
				<div class="colNamesArea">
					<div> <p class="colname" id="name4">L</p></div>
					<div> <p class="colname" id="name5">A</p></div>
					<div> <p class="colname" id="name6">B</p></div>
				</div>
				<div class="numberboxArea">
					<div> <input type="number" tabindex="-1" class="numberbox" id="box4" onchange="boxEvent(4)"> </div>
					<div> <input type="number" tabindex="-1" class="numberbox" id="box5" onchange="boxEvent(5)"> </div>
					<div> <input type="number" tabindex="-1" class="numberbox" id="box6" onchange="boxEvent(6)"> </div>
				</div>
				<div class="sliderArea">
					<div> <input type="range" tabindex="-1" min="-100" max="100" class="slider" id="slider4" oninput="sliderEvent(4)"> </div>
					<div> <input type="range" tabindex="-1" min="-100" max="100" class="slider" id="slider5" oninput="sliderEvent(5)"> </div>
					<div> <input type="range" tabindex="-1" min="-100" max="100" class="slider" id="slider6" oninput="sliderEvent(6)"> </div>
				</div>
			</div>
			<div class="extraSettings" id="extra2">
				<div>
				<fieldset>
					<legend>Стандарт освещения</legend>
					<div>
    						<input type="radio" tabindex="-1" id="lightD65" checked="checked" name="setting2" oninput="setLabSetting('d65')"/>
    						<label for="setting1">D65</label>
  					</div>
  					<div>
    						<input type="radio" tabindex="-1" id="lightD50" name="setting2" oninput="setLabSetting('d50')"/>
    						<label for="setting2">D50</label>
  					</div>
  					<div>
    						<input type="radio" tabindex="-1" id="lightE" name="setting2" oninput="setLabSetting('e')"/>
    						<label for="setting2">E</label>
  					</div>
				</fieldset>
				</div>
				<div>
					<p id="clippingError">ERROR</p>
				</div>
			</div>
		</div>

		<div class="clBlock" id="hsl">
			<div class="slidersAndBoxes">
				<div class="colNamesArea">
					<div> <p class="colname" id="name7">H</p></div>
					<div> <p class="colname" id="name8">S</p></div>
					<div> <p class="colname" id="name9">V</p></div>
				</div>
				<div class="numberboxArea">
					<div> <input type="number" tabindex="-1" class="numberbox" id="box7" onchange="boxEvent(7)"> </div>
					<div> <input type="number" tabindex="-1" class="numberbox" id="box8" onchange="boxEvent(8)"> </div>
					<div> <input type="number" tabindex="-1" class="numberbox" id="box9" onchange="boxEvent(9)"> </div>
				</div>
				<div class="sliderArea">
					<div> <input type="range" tabindex="-1" min="0" max="360" value="100" class="slider" id="slider7" oninput="sliderEvent(7)"> </div>
					<div> <input type="range" tabindex="-1" min="0" max="100" value="50" class="slider" id="slider8" oninput="sliderEvent(8)"> </div>
					<div> <input type="range" tabindex="-1" min="0" max="100" value="50" class="slider" id="slider9" oninput="sliderEvent(9)"> </div>
				</div>
			</div>
		</div>
		</div>

		<div id="display">
			<canvas id="palette"></canvas>
		</div>
	</div>
</div>
</body>
<script src="init.js"></script>
<script src="math.js"></script>
<script src="main.js"></script>
<script src="startup.js"></script>
</html>
